<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 운명의 주사위</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app">

    <!-- 시작 화면 -->
    <section id="start-screen" class="screen active">
      <h1>🚀 운명의 주사위</h1>
      <p class="subtitle">싱글플레이 또는 멀티플레이로 주사위를 굴려 보세요.</p>
      <div class="button-row">
        <button id="single-btn" class="primary">싱글플레이</button>
        <button id="multi-btn" class="secondary">멀티플레이</button>
      </div>
    </section>

    <!-- 방 / 로비 화면 -->
    <section id="room-screen" class="screen">

      <!-- 로비 패널 -->
      <div id="lobby-panel" class="panel-block">
        <div class="lobby-tabs">
          <button id="create-room-btn" class="tab-btn active">방 만들기</button>
          <button id="quick-join-btn" class="tab-btn">빠른 입장</button>
        </div>

        <div id="lobby-list" class="lobby-list"></div>
        <p id="lobby-msg" class="hint">
          생성된 방이 없습니다. 먼저 방을 만들어 주세요.
        </p>
      </div>

      <!-- 방 내부 패널 -->
      <div id="room-panel" class="panel-block hidden">
        <div class="room-header">
          <h2 id="room-title">player0000의 방</h2>
          <span id="host-badge" class="badge">방장</span>
        </div>

        <div id="player-list" class="player-grid"></div>

        <div class="room-controls">
          <button id="ready-btn" class="primary">준비</button>
          <button id="start-game-btn" class="secondary" disabled>
            게임 시작
          </button>
          <button id="leave-room-btn" class="secondary">
            방 나가기
          </button>
        </div>

        <p id="room-hint" class="hint">
          모든 플레이어 준비 완료 시 방장이 게임을 시작할 수 있습니다.
        </p>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="game-screen" class="screen">
      <header class="turn-header">
        <h2 id="turn-display">[ 🎲 Player0000 | Player0000 ]</h2>
      </header>

      <canvas id="board" width="880" height="420"></canvas>

      <div class="game-controls">
        <button id="dice-btn" class="primary">
          🎲 주사위 굴리기
        </button>
        <div id="dice-result" class="dice-result">
          결과: -
        </div>
      </div>

      <p id="event-log" class="event-log">
        게임을 시작합니다.
      </p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
